name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\check-syntax.ps1
      - name: Language files
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\check-lang.ps1
