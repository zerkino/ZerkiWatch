name: build-exe
# Release zip = ZerkiWatch.bat + Installer.bat + languages (NO .exe: unsigned PS2EXE files are flagged by
# Windows Defender as false positives, so releases ship the readable .bat).
#  - pushing a tag like v6.1.2: checks, packages and attaches the zip to a GitHub Release.
#  - "Run workflow" button (Actions tab): same, plus an optional PS2EXE test build kept as an artifact only.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tools\check-syntax.ps1
          powershell -ExecutionPolicy Bypass -File tools\check-lang.ps1
      - name: Build ZerkiWatch.exe with PS2EXE (manual runs only, never released)
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $t = [IO.File]::ReadAllText("$PWD\ZerkiWatch.bat")
          $i = $t.IndexOf('#PS' + 'START')
          [IO.File]::WriteAllText("$PWD\ZerkiWatch-tmp.ps1", $t.Substring($i + 8), [Text.Encoding]::ASCII)
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
          Invoke-ps2exe -inputFile "$PWD\ZerkiWatch-tmp.ps1" -outputFile "$PWD\ZerkiWatch.exe" -noConsole -requireAdmin -STA -title 'ZerkiWatch' -iconFile "$PWD\ZerkiWatch.ico"
          if (-not (Test-Path "$PWD\ZerkiWatch.exe")) { throw 'ZerkiWatch.exe was not created' }
          Remove-Item "$PWD\ZerkiWatch-tmp.ps1"
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ZerkiWatch.bat, ZerkiWatch.ico, Installer.bat, LICENSE, README.md, README.fr.md dist\
          Copy-Item lang dist\lang -Recurse
          Compress-Archive -Path dist\* -DestinationPath ZerkiWatch-windows.zip
          $h = @((Get-FileHash ZerkiWatch.bat -Algorithm SHA256).Hash + '  ZerkiWatch.bat', (Get-FileHash ZerkiWatch-windows.zip -Algorithm SHA256).Hash + '  ZerkiWatch-windows.zip')
          if (Test-Path ZerkiWatch.exe) { $h += (Get-FileHash ZerkiWatch.exe -Algorithm SHA256).Hash + '  ZerkiWatch.exe (test build, not released)' }
          $h | Set-Content SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZerkiWatch-windows
          path: |
            ZerkiWatch-windows.zip
            SHA256.txt
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZerkiWatch-windows.zip
            ZerkiWatch.bat
            SHA256.txt
          body_path: .github/release-notes.md
          name: ZerkiWatch ${{ github.ref_name }}
