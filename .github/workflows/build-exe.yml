name: build-exe
# Builds the release zip on a Windows runner:
#   ZerkiWatch.exe = tiny launcher compiled from tools/launcher (no embedded script) -> starts ZerkiWatch.bat
#   ZerkiWatch.bat = the whole program, readable
# The exe is scanned with Windows Defender on the runner and gets a signed build-provenance attestation.
#  - pushing a tag like v6.1.2 : builds and attaches the zip to a GitHub Release.
#  - "Run workflow" button     : same, kept as a downloadable artifact (test).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create the GitHub Release (and the tag) from this run'
        type: boolean
        default: false
      tag:
        description: 'Tag to create when release is ticked (must start with v)'
        type: string
        default: 'v7.0.0'
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tools\check-syntax.ps1
          powershell -ExecutionPolicy Bypass -File tools\check-lang.ps1
      - name: Build ZerkiWatch.exe (launcher)
        shell: powershell
        run: |
          $csc = Join-Path $env:windir 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /out:ZerkiWatch.exe /win32icon:ZerkiWatch.ico /win32manifest:tools\launcher\app.manifest /reference:System.Windows.Forms.dll tools\launcher\ZerkiWatchLauncher.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ZerkiWatch.exe)) { throw 'ZerkiWatch.exe was not created' }
      - name: Windows Defender scan of the exe (informational)
        continue-on-error: true
        shell: powershell
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -Scan -ScanType 3 -File "$PWD\ZerkiWatch.exe" -DisableRemediation
          Write-Host "Defender exit code: $LASTEXITCODE (0 = nothing found)"
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ZerkiWatch.exe, ZerkiWatch.bat, ZerkiWatch.ico, Installer.bat, LICENSE, README.md, README.fr.md dist\
          Copy-Item lang dist\lang -Recurse
          Compress-Archive -Path dist\* -DestinationPath ZerkiWatch-windows.zip
          $h = @(
            (Get-FileHash ZerkiWatch.exe -Algorithm SHA256).Hash + '  ZerkiWatch.exe',
            (Get-FileHash ZerkiWatch.bat -Algorithm SHA256).Hash + '  ZerkiWatch.bat',
            (Get-FileHash ZerkiWatch-windows.zip -Algorithm SHA256).Hash + '  ZerkiWatch-windows.zip')
          $h | Set-Content SHA256.txt
      - name: Build ZerkiWatch-Setup.exe (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $m = Select-String -Path ZerkiWatch.bat -Pattern '^\$APPVER = ''([^'']+)''' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$ver" tools\installer\ZerkiWatch.iss
          if (-not (Test-Path dist-setup\ZerkiWatch-Setup.exe)) { throw 'ZerkiWatch-Setup.exe was not created' }
          Copy-Item dist-setup\ZerkiWatch-Setup.exe .
          (Get-FileHash ZerkiWatch-Setup.exe -Algorithm SHA256).Hash + '  ZerkiWatch-Setup.exe' | Add-Content SHA256.txt
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ZerkiWatch.exe
            ZerkiWatch-Setup.exe
            ZerkiWatch-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ZerkiWatch-windows
          path: |
            ZerkiWatch-windows.zip
            ZerkiWatch-Setup.exe
            SHA256.txt
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ZerkiWatch-windows.zip
            ZerkiWatch-Setup.exe
            ZerkiWatch.bat
            SHA256.txt
          body_path: .github/release-notes.md
          name: ZerkiWatch ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
